name: Keep database awake

# Supabase pauses free projects after 7 days of no activity.
#
# This portal is used a handful of times a term, not daily, so the December
# break WILL trip that pause. Restoring is a manual click in the dashboard, and
# the person who discovers it is a teacher on the first morning of term. This
# job makes that not happen.

on:
  schedule:
    # Twice weekly, comfortably inside the 7-day window even if one run fails.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Touch the database
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # grade_levels is reference data readable by any authenticated role and
          # never empty, so a successful response proves the database is awake.
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/grade_levels?select=code&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "HTTP ${code}"
          # 200 means awake. 401 also proves the project is running, since a
          # paused project does not answer at all.
          if [[ "$code" == "200" || "$code" == "401" ]]; then
            echo "Database is awake."
          else
            cat /tmp/out
            echo "::error::Supabase did not respond as expected. The project may be paused."
            exit 1
          fi
