name: Nightly backup

# The portal runs on free tiers, and Supabase free has no point-in-time
# recovery. A school losing a term of marks is a crisis, so this is the recovery
# story: an encrypted dump pushed to storage on entirely different
# infrastructure, every night, with 30 days of history.
#
# A backup sitting on the same account as the thing it protects is not a backup.

on:
  schedule:
    # 01:30 UTC is 04:30 in Nairobi: after any late marking, before the school day.
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%d)"
          echo "BACKUP_FILE=grace-portal-${STAMP}.sql.gz.gpg" >> "$GITHUB_ENV"

          # --no-owner / --no-acl so the dump restores into a fresh project
          # without fighting over Supabase-managed roles.
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-acl --clean --if-exists \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$BACKUP_PASSPHRASE" \
                  --output "grace-portal-${STAMP}.sql.gz.gpg"

          ls -lh "grace-portal-${STAMP}.sql.gz.gpg"

      # INTERIM STORAGE. This is a bridge, not the destination.
      #
      # The dump belongs on infrastructure unrelated to the thing it protects,
      # and an artifact lives on the same GitHub account that runs this job. It
      # is off Supabase, which is what matters most, and it needs no card and no
      # new provider, so it beats the status quo of no backups at all.
      #
      # Replace with an scp to /srv/backups/db on the VPS once that box exists.
      # Retention then moves to a `find -mtime` on the server and this 90-day
      # ceiling stops applying.
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          # 90 is the maximum GitHub allows, and retention is what makes this a
          # backup rather than a copy of last night.
          retention-days: 90
          # The payload is already gzipped and encrypted, so re-compressing it
          # only burns runner time for nothing.
          compression-level: 0
          if-no-files-found: error

      - name: Report failure loudly
        if: failure()
        run: |
          echo "::error::Nightly backup FAILED. The portal has no point-in-time"
          echo "::error::recovery on the Supabase free tier, so an unnoticed run"
          echo "::error::of failures means no recovery path. Investigate today."
